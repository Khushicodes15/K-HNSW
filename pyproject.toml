[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "khnsw"
version = "0.1.0"
description = "Kinetic Hierarchical Navigable Small World graph topology repair under vector updates"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Khushi Dhona" },
    { name = "Mansi Bhattacharjee" },
    { name = "Arpanjot Kaur" },
    { name = "Saanvi Srivastava" },
    { name = "Ayushman Acharya" },
]
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "jsonschema>=4.20.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
    "httpx>=0.27.0",
]
bench = [
    "hnswlib>=0.8.0",
    "faiss-cpu>=1.8.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.0",
    "h5py>=3.10.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

