name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python Lint & Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        env:
          HNSWLIB_NO_NATIVE: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
          # hnswlib has no pre-built wheels on PyPI and setup.py defaults to -march=native,
          # baking in the builder runner's CPU and causing SIGILL (exit code 132) on runners
          # with different CPU features. Evict any cached native wheel and build with HNSWLIB_NO_NATIVE=1.
          pip cache remove "hnswlib*" || true
          HNSWLIB_NO_NATIVE=1 pip install --no-binary hnswlib "hnswlib>=0.8.0"
          # Try installing bench extra; hnswlib/faiss install cleanly on linux
          HNSWLIB_NO_NATIVE=1 pip install --no-binary hnswlib -e ".[bench]" || echo "Bench extra installation skipped"

      - name: Ruff Lint check
        run: ruff check .

      - name: Ruff Format check
        run: ruff format --check .

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

